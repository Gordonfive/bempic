name: Repository checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run semantic proof tests
        run: python3 -m unittest prototype.tests.test_proof -v
      - name: Validate documentation and repository consistency
        run: python3 -m scripts.validate_docs
      - name: Run interrupted-transfer demo
        run: python3 -m prototype.demo > /dev/null
      - name: Run deterministic benchmark
        run: python3 -m prototype.benchmark
